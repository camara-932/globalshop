global
    maxconn 2000

defaults
    mode http
    timeout connect 3s
    timeout client  120s
    timeout server  120s
    option redispatch
    retries 2

frontend web
    bind *:8000
    default_backend apis

backend apis
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api1 api1:8000 check inter 2s fall 2 rise 1
    server api2 api2:8000 check inter 2s fall 2 rise 1
